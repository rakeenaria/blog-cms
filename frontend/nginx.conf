server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://blog-cms-production-36db.up.railway.app/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host blog-cms-production-36db.up.railway.app;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /sanctum/ {
        proxy_pass https://blog-cms-production-36db.up.railway.app/sanctum/;
        proxy_ssl_server_name on;
        proxy_set_header Host blog-cms-production-36db.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /storage/ {
        proxy_pass https://blog-cms-production-36db.up.railway.app/storage/;
        proxy_ssl_server_name on;
        proxy_set_header Host blog-cms-production-36db.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
